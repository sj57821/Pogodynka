App\Entity\Location:
    properties:
        city:
            - NotBlank:
                  groups: [new, edit]
                  message: "Nazwa miasta nie może być pusta."
            - Length:
                  max: 255
                  groups: [new, edit]
        latitude:
            - NotBlank:
                  groups: [new, edit]
                  message: "Szerokość geograficzna jest wymagana."
            - Range:
                  min: -90
                  max: 90
                  groups: [new, edit]
                  notInRangeMessage: "Szerokość musi być pomiędzy {{ min }} a {{ max }}."
        longitude:
            - NotBlank:
                  groups: [new, edit]
                  message: "Długość geograficzna jest wymagana."
            - Range:
                  min: -180
                  max: 180
                  groups: [new, edit]
                  notInRangeMessage: "Długość musi być pomiędzy {{ min }} a {{ max }}."

App\Entity\Measurement:
    properties:
        celsius:
            - NotBlank:
                  groups: [new, edit]
                  message: "Temperatura jest wymagana."
            - Range:
                  min: -100
                  max: 100
                  groups: [new, edit]
                  notInRangeMessage: "Temperatura musi być pomiędzy {{ min }} a {{ max }}."
        date:
            - NotBlank:
                  groups: [new, edit]
                  message: "Data jest wymagana."
